# Advisory research-control profile for the goldeneye film package.
# Declarative, validation-only overlay: this file does not execute agents.

project: goldeneye
mission: ARKANGEL

review_gates:
  - "pytest --cov=src --cov-fail-under=90 (line + branch)"
  - "ruff check and ruff format --check on src/ scripts/ tests/"
  - "mypy on src/ scripts/"
  - "zero-mock audit of tests/"
  - "pure-domain core imports without bond-api (subprocess gate)"
  - "manuscript token cross-reference (every section token is generated)"

source_policy:
  - "closed-form, published physics (Glasstone & Dolan 1977; IEC 61000-2-9; MIL-STD-188-125; Froehlich 1995; Ritter 1892)"
  - "scenario parameters declared in manuscript/config.yaml; no untracked random reliance"
  - "deterministic: fixed seed 0, no wall-clock in persisted analysis artifacts"

artifact_expectations:
  - "src/goldeneye/{emp_model,kill_radius,dam_security,scenario}.py — pure domain core"
  - "src/goldeneye/mission.py — frozen bond_api MissionProvider adapter + GadgetRegistry"
  - "src/goldeneye/manuscript_variables.py + figures/ — manuscript hydration and concept figures"
  - "scripts/{brief,recon,plan,execute,debrief,z_generate_manuscript_variables}.py — thin CLIs"
  - "output/data/* and output/figures/* — regenerable, gitignored"

benchmark_rubric:
  prefer: "deterministic closed-form verification (known vectors, analytic limits, invariants)"
  avoid: "nondeterministic RNG, wall-clock timing in persisted results, mock frameworks"
