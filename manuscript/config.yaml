# GoldenEye: ARKANGEL — Special-Agent Mission Software
# BOND film package (GoldenEye, 1995; mission codename ARKANGEL).
# This file is loaded by `src/goldeneye/scenario.py::load_scenario_config` and
# `src/goldeneye/manuscript_variables.py` — it is the single source of truth
# for the paper identity and the scenario parameters that drive every token.

paper:
  # RASP Standard: Title must be descriptive and objective.
  title: "GoldenEye: ARKANGEL — Special-Agent Mission Software"
  subtitle: "Orbital EMP effects, electronics kill-radius analysis, and Arkangel dam-facility security"
  version: "0.1.0"
  date: "2026-08-04"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

# Local-only working tree: no remote and no DOI. The publication block is kept
# intentionally minimal for the fork contract (see the bond suite guardrails).
publication:
  github_repository: ""
  repository_url: ""

keywords:
  - "orbital EMP"
  - "high-altitude electromagnetic pulse (HEMP)"
  - "electronics kill radius"
  - "vulnerability classes"
  - "dam security"
  - "breach flood risk"
  - "defense in depth"
  - "reproducible research"

metadata:
  license: "MIT"
  language: "en"

# Scenario parameters — read by `load_scenario_config` (defaults in
# `src/goldeneye/scenario.py::ARKANGEL`). Every analysis token derives from here.
scenario:
  name: "arkangel"
  codename: "ARKANGEL"
  weapon:
    yield_kt: 2000.0
    burst_altitude_km: 300.0
  reservoir:
    name: "arkangel"
    volume_m3: 130000000.0
    head_m: 75.0
  facility:
    distance_km: 8.0
    elevation_m: 10.0
  access:
    layers:
      - name: outer_perimeter
        detection_probability: 0.35
        response_time_min: 10.0
        barrier: "patrolled perimeter fence"
      - name: checkpoint
        detection_probability: 0.60
        response_time_min: 5.0
        barrier: "armed guard post + ID verification"
      - name: inner_perimeter
        detection_probability: 0.50
        response_time_min: 4.0
        barrier: "camera zone + hardened lock"
      - name: control_room
        detection_probability: 0.90
        response_time_min: 2.0
        barrier: "biometric access to mission control"
