# ARKANGEL mission experiment plan (goldeneye film package).
# Declarative, validation-only overlay: does not execute autonomous agents.

mission: ARKANGEL
film: GoldenEye (1995)

scenario:
  weapon_yield_kt: 2000.0
  burst_altitude_km: 300.0
  reservoir_volume_m3: 130000000.0
  dam_head_m: 75.0
  facility_distance_km: 8.0
  facility_elevation_m: 10.0
  access_layers: 4

primary_metrics:
  - "nadir E1 field (V/m) and horizon footprint (km, km^2)"
  - "kill radius (km) and footprint fraction per vulnerability class"
  - "orbital platform period (min), speed (km/s), pass duration (min), target elevation (deg)"
  - "coupling: induced voltage (V), shielding effectiveness (dB), penetrated field (V/m), protection margin (dB)"
  - "grid: down-set, expected served load (MW), served fraction, min reliability, min disjoint paths"
  - "breach peak discharge (m^3/s), breach width (m), hydrograph duration (min), arrival (min), risk rating"
  - "defense-in-depth detection probability and composite security score"

expected_figures:
  - id: emp_footprint
    file: output/figures/emp_footprint.png
    description: "EMP radial field profiles, kill radius vs altitude, damage probability, footprint vs yield"
  - id: flood_wave
    file: output/figures/flood_wave.png
    description: "Ritter dam-break downstream profiles and facility inundation vs time"
  - id: grid_resilience
    file: output/figures/grid_resilience.png
    description: "Regional network node survival map and per-critical-load reliability / redundancy"

baseline:
  - "unprotected microelectronics destroyed over the whole visible footprint"
  - "legacy vacuum-tube electronics immune (kill radius 0 km)"
  - "originally served 100% of critical load -> served fraction after strike"

ablation:
  - "kill radius vs burst altitude (10-1000 km) for fixed yield"
  - "kill-radius fraction vs yield (3-3000 kt) at fixed altitude"
  - "grid served load vs the set of certain failures (down-set removal)"

determinism:
  seed: 0
  input_hash: "SHA-256 of scenario_input_dict (sorted, compact JSON)"
